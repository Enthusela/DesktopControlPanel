version: '3.8'

services:
  hub:
    build:
      context: .
      target: production
    container_name: desktop_hub_prod
    ports:
      - "8080:8080"
    devices:
      # Arduino on Raspberry Pi
      - /dev/ttyACM0:/dev/ttyACM0
    privileged: false
    # On Raspberry Pi, we need access to GPIO
    volumes:
      - /sys/class/gpio:/sys/class/gpio
      - /dev/gpiomem:/dev/gpiomem
    environment:
      - NODE_ENV=production
      - GPIO_MODE=hardware
      - SERIAL_PORT=/dev/ttyACM0
    restart: always
    networks:
      - desktop_network

networks:
  desktop_network:
    driver: bridge
