version: '3.8'

services:
  hub:
    build:
      context: .
      target: development
    container_name: desktop_hub
    ports:
      - "8080:8080"
    devices:
      # Pass through Arduino USB device
      # Update this path based on your Arduino's device path
      - ${SERIAL_PORT:-/dev/ttyACM1}:${SERIAL_PORT:-/dev/ttyACM1}
    privileged: false
    volumes:
      # Mount source code for hot reload during development
      - .:/app
      # Prevent overwriting node_modules
      - /app/node_modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      # Set to 'mock' to disable GPIO on non-Raspberry Pi systems
      - GPIO_MODE=${GPIO_MODE:-mock}
      # Serial port path (can be overridden)
      - SERIAL_PORT=${SERIAL_PORT:-/dev/ttyACM1}
    restart: unless-stopped
    networks:
      - desktop_network

networks:
  desktop_network:
    driver: bridge
